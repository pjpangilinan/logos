name: Deploy to GitHub Pages

on:
  # Deploy after fetch workflow updates the DB
  workflow_run:
    workflows: ["Fetch Data"]
    types: [completed]
    branches: [main]
  # Also deploy on pushes to main (e.g. code changes)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Copy sql.js WASM to public
        working-directory: app
        run: cp node_modules/sql.js/dist/*.wasm public/

      - name: Copy aggregator.db to public
        run: cp data/aggregator.db app/public/aggregator.db

      - name: Build
        working-directory: app
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
