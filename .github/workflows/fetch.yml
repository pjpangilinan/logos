name: Fetch Data

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Fetch TMDB (movies & TV)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        working-directory: scripts
        run: node fetch-tmdb.js
        continue-on-error: true

      - name: Fetch RAWG (games)
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        working-directory: scripts
        run: node fetch-rawg.js
        continue-on-error: true

      - name: Fetch RSS (news)
        working-directory: scripts
        run: node fetch-rss.js
        continue-on-error: true

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aggregator.db
          if git diff --cached --quiet; then
            echo "No changes to aggregator.db — skipping commit"
          else
            git commit -m "chore: update aggregator.db [skip ci]"
            git push
          fi
